services:
  postgres:
    image: postgres:16-alpine
    container_name: optimus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optimus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optimus}
      POSTGRES_DB: ${POSTGRES_DB:-optimus_fleet}
    ports:
      - "5433:5432"
    volumes:
      - optimus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optimus} -d ${POSTGRES_DB:-optimus_fleet}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  optimus_pgdata:
